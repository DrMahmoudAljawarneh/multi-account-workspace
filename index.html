<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebSpace</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="sidebar">
        <div id="sidebar-list"></div>
        <div id="sidebar-footer"><span class="sidebar-text">WebSpace &middot; v1.0.9</span></div>
    </div>
    <div id="main-content">
        <div id="loading-bar"></div>
        <div id="toolbar">
            <button id="btn-toggle-sidebar" class="no-drag icon-btn" title="Toggle sidebar (Ctrl+B)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
            </button>
            <button id="btn-back" class="no-drag icon-btn disabled" title="Back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
            </button>
            <button id="btn-forward" class="no-drag icon-btn disabled" title="Forward">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
            </button>
            <button id="btn-reload" class="no-drag icon-btn" title="Reload">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            </button>
            <button id="btn-split" class="no-drag icon-btn" title="Toggle split view">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
            </button>

            <div class="toolbar-spacer"></div>

            <button id="btn-vault" class="no-drag icon-btn" title="Secure credential vault">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 8.3-8.3"/><path d="m16 7 2.5 2.5"/><path d="m19 4 2 2"/></svg>
            </button>
            <span id="palette-hint" class="kbd-hint no-drag" title="Command palette"><kbd>Ctrl</kbd><kbd>K</kbd></span>
            <button id="btn-settings" class="no-drag icon-btn" title="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>

            <!-- Linux Window Controls -->
            <div class="window-controls no-drag">
                <button id="win-min" class="win-btn" title="Minimize">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 12h12"/></svg>
                </button>
                <button id="win-max" class="win-btn" title="Maximize">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="13" height="13" rx="1.5"/></svg>
                </button>
                <button id="win-close" class="win-btn win-btn-close" title="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6.5 6.5l11 11"/><path d="M17.5 6.5l-11 11"/></svg>
                </button>
            </div>
        </div>
        <div id="workspaces">
            <div id="left-pane" class="pane active-pane"><div id="left-stack" style="flex:1; display:flex;"></div></div>
            <div id="divider"></div>
            <div id="right-pane" class="pane" style="display:none;"><div id="right-stack" style="flex:1; display:flex;"></div></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>Settings &amp; Profiles</h2>
            <p class="modal-hint">Edit the JSON below. Add <code>"customCSS": "body { background: black !important; }"</code> to inject custom styles!</p>
            <textarea id="config-editor" spellcheck="false"></textarea>
            <div class="modal-actions">
                <button id="btn-cancel-settings">Cancel</button>
                <button id="btn-save-settings" class="btn-primary">Save &amp; Reload</button>
            </div>
        </div>
    </div>

    <!-- Credential Vault Modal -->
    <div id="vault-modal" class="modal-overlay">
        <div class="modal-box" style="width: 400px;">
            <h2>Secure Vault</h2>
            <p class="modal-hint">Store credentials to auto-login to apps. Passwords are encrypted by the OS keyring.</p>

            <div class="field-group">
                <label class="form-label" for="vault-appname">App Name (e.g., WhatsApp, Gmail)</label>
                <input type="text" id="vault-appname" class="input" autocomplete="off">
            </div>
            <div class="field-group">
                <label class="form-label" for="vault-username">Username / Email</label>
                <input type="text" id="vault-username" class="input" autocomplete="off">
            </div>
            <div class="field-group">
                <label class="form-label" for="vault-password">Password</label>
                <input type="password" id="vault-password" class="input" autocomplete="new-password">
            </div>

            <div class="modal-actions" style="margin-top: 5px;">
                <button id="btn-cancel-vault">Cancel</button>
                <button id="btn-save-vault" class="btn-primary">Save to OS Keychain</button>
            </div>
        </div>
    </div>

    <!-- Command Palette Modal -->
    <div id="palette-overlay" class="modal-overlay">
        <div class="modal-box" id="palette-box">
            <input type="text" id="palette-input" placeholder="Search apps or commands..." autocomplete="off">
            <div id="palette-results"></div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="renderer.js"></script>
</body>
</html>
